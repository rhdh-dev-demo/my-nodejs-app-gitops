{{- if eq .Values.image.host "image-registry.openshift-image-registry.svc:5000" }}
# =============================================================================
# Image Puller RBAC for OpenShift Internal Registry
# =============================================================================
# Grants staging and prod namespaces permission to pull images from dev namespace.
# Only needed when using OpenShift internal registry for cross-namespace pulls.
# =============================================================================

---
# Grant staging namespace permission to pull images from dev
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.app.name }}-staging-image-puller
  namespace: {{ .Values.app.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.app.name }}
    app.kubernetes.io/component: rbac
subjects:
  - kind: ServiceAccount
    name: {{ .Values.app.name }}-staging
    namespace: {{ .Values.app.name }}-staging
  - kind: ServiceAccount
    name: default
    namespace: {{ .Values.app.name }}-staging
roleRef:
  kind: ClusterRole
  name: system:image-puller
  apiGroup: rbac.authorization.k8s.io

---
# Grant prod namespace permission to pull images from dev
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.app.name }}-prod-image-puller
  namespace: {{ .Values.app.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.app.name }}
    app.kubernetes.io/component: rbac
subjects:
  - kind: ServiceAccount
    name: {{ .Values.app.name }}-prod
    namespace: {{ .Values.app.name }}-prod
  - kind: ServiceAccount
    name: default
    namespace: {{ .Values.app.name }}-prod
roleRef:
  kind: ClusterRole
  name: system:image-puller
  apiGroup: rbac.authorization.k8s.io

{{- end }}

