# Production environment overrides
# This file extends Values.yaml with production-specific configurations

# Image tag - updated by Tekton promote pipeline
image:
  tag: "v1.0.0"
  digest: "sha256:3da917f497ee58ae8cebb2c29202ca052a1466c0ddf8cdeb3f79212ff1e61e47"

# Environment variables - override for production
env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "8080"
  - name: APP_ENV
    value: "prod"

replicaCount: 3

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

route:
  enabled: true
  host: ""  # Will be auto-generated or set via ArgoCD values override

