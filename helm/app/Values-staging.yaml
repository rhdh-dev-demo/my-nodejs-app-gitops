# Staging environment overrides
# This file extends Values.yaml with staging-specific configurations

# Image tag - updated by Tekton promote pipeline
image:
  tag: "staging-v1"
  digest: "sha256:3da917f497ee58ae8cebb2c29202ca052a1466c0ddf8cdeb3f79212ff1e61e47"

# Environment variables - override for staging
env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "8080"
  - name: APP_ENV
    value: "staging"

replicaCount: 2

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

route:
  enabled: true
  host: ""  # Will be auto-generated or set via ArgoCD values override

